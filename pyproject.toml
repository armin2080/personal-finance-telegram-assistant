[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-telegram-assistant"
version = "0.1.0"
description = "A local-first, single-user personal finance assistant with a Telegram interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - no license granted" }
authors = [{ name = "Project owner" }]
dependencies = [
  "fastapi>=0.115,<1",
  "python-telegram-bot>=22.8,<23",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.14,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
finance-assistant = "personal_finance_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_finance_assistant = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unused_ignores = true
